name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The render tests draw finished PDFs with poppler's pdftoppm, as a viewer would.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # The build fails if the plugin exceeds Figma's 15 MB publishing limit.
      - run: npm run build
      # Tests read dist/, so they run after the build.
      - run: npm test
