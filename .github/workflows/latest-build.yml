name: Latest build

# Every push to main rebuilds the plugin and refreshes one pre-release, tagged
# latest-build, with open-print-latest.zip and its Ghostscript source zip. The
# tag moves to each new commit; the pre-release is never versioned or marked as
# the latest release, so versioned vX.Y.Z releases are unaffected.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - run: scripts/package-release.sh latest
      - name: Move the latest-build tag to this commit
        run: |
          git tag -f latest-build
          git push -f origin refs/tags/latest-build
      - name: Update the latest-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          title="Latest build ($short)"
          notes="Built automatically from main at ${GITHUB_SHA}. Not a versioned release: it changes with every merge and hasn't been reviewed for Figma Community. For a stable version, use the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest)."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create latest-build --verify-tag --prerelease --latest=false --title "$title" --notes "$notes"
          fi
          gh release upload latest-build release/*.zip --clobber
          # Remove any asset this build didn't produce.
          for asset in $(gh release view latest-build --json assets -q '.assets[].name'); do
            [ -f "release/$asset" ] || gh release delete-asset latest-build "$asset" -y
          done
