<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:13px/1.5 Inter,system-ui,sans-serif;background:var(--figma-color-bg,#fafafa);color:var(--figma-color-text,#202020)}h1{font-size:23px;letter-spacing:-.6px;margin:0}p{color:var(--figma-color-text-secondary,#666)}label{display:block;margin:14px 0 5px;font-weight:600}input,select{width:100%;padding:9px;border:1px solid #aaa;border-radius:5px;font:inherit;background:var(--figma-color-bg,#fff);color:inherit}input[type="checkbox"]{width:auto;margin-right:6px}.size{display:flex;gap:12px}.size>div{flex:1}ol{padding-left:22px;max-height:115px;overflow:auto}li{padding:3px 0;overflow-wrap:anywhere}button{font:inherit;cursor:pointer;padding:10px 14px;border:0;border-radius:6px}#export{width:100%;background:#542276;color:white;margin-top:18px;font-weight:600}button:disabled{opacity:.45;cursor:default}#cancel{margin-top:8px;width:100%}#status{white-space:pre-line;margin-top:12px}small{color:var(--figma-color-text-secondary,#666)}a{color:inherit}
</style></head><body><h1>Open Print</h1><strong>Selected frames</strong><ol id="frames"><li>Select frames in your document.</li></ol><small>Pages follow frame names, in numerical order.</small><label><input id="auto-size" type="checkbox" checked>Use frame size</label><small id="size-hint">Select frames to infer their print size.</small><div class="size"><div><label for="width">Width, mm</label><input id="width" type="number" min="10" max="2000" step=".01" ></div><div><label for="height">Height, mm</label><input id="height" type="number" min="10" max="2000" step=".01" ></div></div><p>Artwork stays at its existing size, aligned to the top left. A smaller page crops the artwork.</p><label for="profile-mode">Color profile</label><select id="profile-mode"><option value="none">No profile</option><option value="custom">Custom CMYK profile…</option></select><div id="custom-profile" hidden><label for="profile">ICC file</label><input id="profile" type="file" accept=".icc,.icm"></div><p id="profile-hint"></p><button id="export" disabled>Export CMYK PDF</button><button id="cancel" hidden>Cancel conversion</button><div id="status" role="status"></div><script>/*BUNDLE*/</script></body></html>
